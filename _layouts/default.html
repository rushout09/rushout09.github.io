<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="d0bbTkoGFxKZWJGN7pWmTsSjwQYZWR8PXDkd0oi18MI" />
{% seo %}
    <style>
      :root { color-scheme: light; --text: #1a1a1a; --muted: #6b6b6b; --link: #1a1a1a; --bg: #ffffff; }
      html { background: var(--bg); }
      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 20px 64px;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      a { color: var(--link); text-underline-offset: 3px; }
      h1, h2, h3 { line-height: 1.3; font-weight: 600; }
      h1 { font-size: 1.15rem; margin: 0 0 2rem; }
      h2 { font-size: 1.05rem; margin: 2.25rem 0 0.5rem; }
      h3 { font-size: 1rem; margin: 1.75rem 0 0.5rem; }
      .site-name { font-weight: 600; text-decoration: none; }
      .post-date { color: var(--muted); font-size: 0.9rem; margin: -1.5rem 0 2rem; }
      .post-list { list-style: none; padding: 0; margin: 0; }
      .post-list li { margin: 0 0 0.6rem; }
      .post-list-date { color: var(--muted); font-size: 0.9rem; margin-left: 0.4rem; white-space: nowrap; }
      blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 2px solid var(--muted); color: var(--muted); }
      img { max-width: 100%; height: auto; }
      pre, code { font-size: 0.9em; }
      footer { margin-top: 4rem; color: var(--muted); font-size: 0.9rem; }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    {% if page.path contains "_posts" %}
    <p><a class="site-name" href="{{ '/' | relative_url }}">Rushabh Agarwal</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%b %d, %Y" }}</p>
    {% endif %}

    {{ content }}

    <footer>
      <a href="https://x.com/rushout09">X</a> ·
      <a href="https://www.youtube.com/@rushout09">YouTube</a> ·
      <a href="https://www.linkedin.com/in/rushout09/">LinkedIn</a> ·
      <a href="https://github.com/rushout09">GitHub</a>
    </footer>
  </body>
</html>
